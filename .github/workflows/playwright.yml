name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  TOTAL_SHARDS: 3

jobs:
  test:
    name: "Shard ${{ matrix.shard }}/${{ env.TOTAL_SHARDS }}"
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests (shard ${{ matrix.shard }}/${{ env.TOTAL_SHARDS }})
        run: npx playwright test --shard=${{ matrix.shard }}/${{ env.TOTAL_SHARDS }}
        env:
          CI: true
          WORKERS: 2
          STANDARD_USERNAME: ${{ secrets.STANDARD_USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          LOCKED_OUT_USER: ${{ secrets.LOCKED_OUT_USER }}
          PETSTORE_API_KEY: ${{ secrets.PETSTORE_API_KEY }}

      - name: Upload blob report (shard ${{ matrix.shard }})
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  merge-reports:
    name: Merge & Publish Report
    if: ${{ !cancelled() }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: blob-report/

      - name: Merge shards into HTML report
        run: npx playwright merge-reports --reporter html ./blob-report

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
